name: Paid product bug
description: Gateway or tool failure on a paid plan (not zodiac disagreements)
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Human Issues are for **paid (Starter+) product / connectivity failures**.
        Free / keyless use is self-serve — see [Support](https://docs.geometry.app/support).

        Do **not** paste a live `zpka_` key. Zodiac / calendar disagreements belong on [Astro wheels](https://docs.geometry.app/astro-wheels), not here.
  - type: input
    id: portal-email
    attributes:
      label: Developer Portal account email
      description: The email on your Stripe / portal subscription (never the raw key)
    validations:
      required: true
  - type: dropdown
    id: tool
    attributes:
      label: Tool / surface
      options:
        - get_date
        - get_compatibility
        - get_name
        - Install / connect
        - Docs only
        - Other
    validations:
      required: true
  - type: input
    id: dates
    attributes:
      label: Date(s) used (if any)
      description: YYYY-MM-DD
      placeholder: "1985-03-15"
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What you got
      description: Summarize or paste a redacted snippet — not secrets
    validations:
      required: true
  - type: input
    id: client
    attributes:
      label: Client / environment
      placeholder: Claude Desktop, Cursor, etc.
